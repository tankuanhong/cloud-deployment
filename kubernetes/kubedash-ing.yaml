apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-${KUBEDASH_LABEL}
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "https://$host/oauth2/auth$KUBEDASH_AUTH_QUERY"
    nginx.ingress.kubernetes.io/auth-signin: "https://$host/oauth2/start?rd=https://$host$request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: X-Auth-Request-Email,X-Auth-Request-Access-Token,X-Auth-Request-Preferred-Username
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${KUBEDASH_HOSTNAME}
    secretName: "${KUBEDASH_TLS_SECRET}"
  rules:
  - host: ${KUBEDASH_HOSTNAME}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: svc-${KUBEDASH_LABEL}-https
            port:
              number: 443
---
apiVersion: v1
kind: Service
metadata:
  name: svc-${KUBEDASH_LABEL}-https
spec:
  type: ExternalName
  externalName: kubernetes-dashboard.kube-system.svc.cluster.local
  ports:
  - port: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-${KUBEDASH_LABEL}-oauth2-proxy
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${KUBEDASH_HOSTNAME}
    secretName: "${KUBEDASH_TLS_SECRET}"
  rules:
  - host: ${KUBEDASH_HOSTNAME}
    http:
      paths:
      - path: /oauth2
        pathType: Prefix
        backend:
          service:
            name: ${KUBEDASH_OAUTH2_PROXY}
            port:
              number: 4180