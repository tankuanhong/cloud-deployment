# https://hub.docker.com/_/caddy

#PVC_START
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-${LITTLELINK_LABEL}
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: ${LITTLELINK_PVC_SIZE}
#PVC_END
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cfg-${LITTLELINK_LABEL}
data:
  Caddyfile: |
    :80 {
      # Set this path to your site's directory.
      root * /data/caddy

      # Enable the static file server.
      file_server
    }
---
apiVersion: v1
kind: Service
metadata:
  name: svc-${LITTLELINK_LABEL}-http
spec:
  ports:
  - port: 80
  selector:
    app: app-${LITTLELINK_LABEL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-${LITTLELINK_LABEL}
  labels:
    app: app-${LITTLELINK_LABEL}
spec:
  selector:
    matchLabels:
      app: app-${LITTLELINK_LABEL}
  template:
    metadata:
      labels:
        app: app-${LITTLELINK_LABEL}
    spec:
      restartPolicy: Always
      containers:
      - image: ${LITTLELINK_IMAGE}
        name: pod-${LITTLELINK_LABEL}
        ports:
        - containerPort: 80
          protocol: TCP
        volumeMounts:
        - name: vol-${LITTLELINK_LABEL}-data
          mountPath: /data
        - name: vol-${LITTLELINK_LABEL}-config
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
      volumes:
      - name: vol-${LITTLELINK_LABEL}-data
        persistentVolumeClaim:
          claimName: pvc-${LITTLELINK_LABEL}
      - name: vol-${LITTLELINK_LABEL}-config
        configMap:
          name: cfg-${LITTLELINK_LABEL}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-${LITTLELINK_LABEL}
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${LITTLELINK_HOSTNAME}
    secretName: "${LITTLELINK_TLS_SECRET}"
  rules:
  - host: ${LITTLELINK_HOSTNAME}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: svc-${LITTLELINK_LABEL}-http
            port:
              number: 80