# https://hub.docker.com/r/syncthing/discosrv

#PVC_START
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-${ST_DISCOSRV_LABEL}
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: ${ST_DISCOSRV_PVC_SIZE}
#PVC_END
---
apiVersion: v1
kind: Service
metadata:
  name: svc-${ST_DISCOSRV_LABEL}-http
spec:
  ports:
  - port: 8080
  selector:
    app: app-${ST_DISCOSRV_LABEL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-${ST_DISCOSRV_LABEL}
  labels:
    app: app-${ST_DISCOSRV_LABEL}
spec:
  selector:
    matchLabels:
      app: app-${ST_DISCOSRV_LABEL}
  template:
    metadata:
      labels:
        app: app-${ST_DISCOSRV_LABEL}
    spec:
      restartPolicy: Always
      containers:
      - image: ${ST_DISCOSRV_IMAGE}
        name: pod-${ST_DISCOSRV_LABEL}
        ports:
        - containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: vol-${ST_DISCOSRV_LABEL}
          mountPath: /var/stdiscosrv
      volumes:
      - name: vol-${ST_DISCOSRV_LABEL}
        persistentVolumeClaim:
          claimName: pvc-${ST_DISCOSRV_LABEL}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-${ST_DISCOSRV_LABEL}
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${ST_DISCOSRV_HOSTNAME}
    secretName: "${ST_DISCOSRV_TLS_SECRET}"
  rules:
  - host: ${ST_DISCOSRV_HOSTNAME}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: svc-${ST_DISCOSRV_LABEL}-http
            port:
              number: 8080