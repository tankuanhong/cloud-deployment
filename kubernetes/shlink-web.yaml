# https://hub.docker.com/r/shlinkio/shlink-web-client

---
apiVersion: v1
kind: Service
metadata:
  name: svc-${SHLINK_WEB_LABEL}-http
spec:
  ports:
  - port: 80
  selector:
    app: app-${SHLINK_WEB_LABEL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-${SHLINK_WEB_LABEL}
  labels:
    app: app-${SHLINK_WEB_LABEL}
spec:
  selector:
    matchLabels:
      app: app-${SHLINK_WEB_LABEL}
  template:
    metadata:
      labels:
        app: app-${SHLINK_WEB_LABEL}
    spec:
      restartPolicy: Always
      containers:
      - image: ${SHLINK_WEB_IMAGE}
        name: con-${SHLINK_WEB_LABEL}
        ports:
        - containerPort: 80
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-${SHLINK_WEB_LABEL}
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${SHLINK_WEB_HOSTNAME}
    secretName: "${SHLINK_WEB_TLS_SECRET}"
  rules:
  - host: ${SHLINK_WEB_HOSTNAME}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: svc-${SHLINK_WEB_LABEL}-http
            port:
              number: 80