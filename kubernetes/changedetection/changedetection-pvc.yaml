# https://hub.docker.com/r/dgtlmoon/changedetection.io

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-${CHANGEDETECTION_LABEL}
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: ${CHANGEDETECTION_PVC_SIZE}