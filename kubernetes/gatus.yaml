# https://github.com/TwiN/gatus#docker
# https://hub.docker.com/r/twinproduction/gatus
# https://github.com/TwiN/gatus/blob/master/.examples/kubernetes/gatus.yaml

#PVC_START
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-${GATUS_LABEL}
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: ${GATUS_PVC_SIZE}
#PVC_END
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cfg-${GATUS_LABEL}
data:
  config.yaml: |
    metrics: true
    storage:
      type: sqlite
      path: /config/data.db
    endpoints:
      - name: vpn
        enabled: true
        group: work
        url: https://vpn.acrc.a-star.edu.sg/dana-na/auth/url_default/welcome.cgi
        method: GET
        interval: 5m
        client:
          insecure: true
        ui:
          hide-hostname: true
          hide-url: true
          dont-resolve-failed-conditions: false
          badge:
            response-time:
              thresholds: [50, 200, 300, 500, 750]
        conditions:
          - "[STATUS] == 200"
      - name: keycloak
        enabled: true
        group: dev
        url: https://keycloak.kuanhong.org/
        method: GET
        interval: 1m
        client:
          insecure: false
        ui:
          hide-hostname: true
          hide-url: true
          dont-resolve-failed-conditions: false
          badge:
            response-time:
              thresholds: [50, 200, 300, 500, 750]
        conditions:
          - "[STATUS] == 200"
---
apiVersion: v1
kind: Service
metadata:
  name: svc-${GATUS_LABEL}-http
spec:
  ports:
  - port: 8080
  selector:
    app: app-${GATUS_LABEL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-${GATUS_LABEL}
  labels:
    app: app-${GATUS_LABEL}
spec:
  selector:
    matchLabels:
      app: app-${GATUS_LABEL}
  template:
    metadata:
      labels:
        app: app-${GATUS_LABEL}
    spec:
      restartPolicy: Always
      containers:
      - image: ${GATUS_IMAGE}
        name: pod-${GATUS_LABEL}
        ports:
        - containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: vol-${GATUS_LABEL}-data
          mountPath: /config
        - name: vol-${GATUS_LABEL}-config
          mountPath: /config/config.yaml
          subPath: config.yaml
      volumes:
      - name: vol-${GATUS_LABEL}-data
        persistentVolumeClaim:
          claimName: pvc-${GATUS_LABEL}
      - name: vol-${GATUS_LABEL}-config
        configMap:
          name: cfg-${GATUS_LABEL}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-${GATUS_LABEL}
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${GATUS_HOSTNAME}
    secretName: "${GATUS_TLS_SECRET}"
  rules:
  - host: ${GATUS_HOSTNAME}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: svc-${GATUS_LABEL}-http
            port:
              number: 8080