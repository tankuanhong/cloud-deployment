# https://hub.docker.com/r/dgtlmoon/changedetection.io

#PVC_START
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-${CHANGEDETECTION_LABEL}
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: ${CHANGEDETECTION_PVC_SIZE}
#PVC_END
---
apiVersion: v1
kind: Service
metadata:
  name: svc-${CHANGEDETECTION_LABEL}-http
spec:
  ports:
  - port: 5000
  selector:
    app: app-${CHANGEDETECTION_LABEL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-${CHANGEDETECTION_LABEL}
  labels:
    app: app-${CHANGEDETECTION_LABEL}
spec:
  selector:
    matchLabels:
      app: app-${CHANGEDETECTION_LABEL}
  template:
    metadata:
      labels:
        app: app-${CHANGEDETECTION_LABEL}
    spec:
      restartPolicy: Always
      containers:
      - image: ${CHANGEDETECTION_IMAGE}
        name: pod-${CHANGEDETECTION_LABEL}
        env:
        - name: BASE_URL
          value: "${CHANGEDETECTION_BASE_URL}"
        - name: PLAYWRIGHT_DRIVER_URL
          value: "${CHANGEDETECTION_PLAYWRIGHT}"
        - name: HIDE_REFERER
          value: "true"
        - name: USE_X_SETTINGS
          value: "1"
        ports:
        - containerPort: 5000
          protocol: TCP
        volumeMounts:
        - name: vol-${CHANGEDETECTION_LABEL}
          mountPath: /datastore
      volumes:
      - name: vol-${CHANGEDETECTION_LABEL}
        persistentVolumeClaim:
          claimName: pvc-${CHANGEDETECTION_LABEL}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-${CHANGEDETECTION_LABEL}
spec:
  ingressClassName: nginx
  rules:
  - host: ${CHANGEDETECTION_HOSTNAME}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: svc-${CHANGEDETECTION_LABEL}-http
            port:
              number: 5000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-${CHANGEDETECTION_LABEL}-oauth2-proxy
  namespace: default
spec:
  ingressClassName: nginx
  rules:
  - host: ${CHANGEDETECTION_HOSTNAME}
    http:
      paths:
      - path: /oauth2
        pathType: Prefix
        backend:
          service:
            name: ${CHANGEDETECTION_OAUTH2_PROXY}
            port:
              number: 4180