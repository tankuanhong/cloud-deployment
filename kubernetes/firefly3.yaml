# https://hub.docker.com/r/fireflyiii/core

#PVC_START
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-${FIREFLY3_LABEL}
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: ${FIREFLY3_PVC_SIZE}
#PVC_END
---
apiVersion: v1
kind: Service
metadata:
  name: svc-${FIREFLY3_LABEL}-http
spec:
  ports:
  - port: 8080
  selector:
    app: app-${FIREFLY3_LABEL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-${FIREFLY3_LABEL}
  labels:
    app: app-${FIREFLY3_LABEL}
spec:
  selector:
    matchLabels:
      app: app-${FIREFLY3_LABEL}
  template:
    metadata:
      labels:
        app: app-${FIREFLY3_LABEL}
    spec:
      restartPolicy: Always
      containers:
      - image: ${FIREFLY3_IMAGE}
        name: pod-${FIREFLY3_LABEL}
        env:
        - name: APP_ENV
          value: "local"
        - name: APP_DEBUG
          value: "false"
        - name: APP_KEY
          value: "${FIREFLY3_APP_KEY}"
        - name: TZ
          value: "${FIREFLY3_TZ}"
        - name: DB_HOST
          value: "svc-${FIREFLY3_DB_LABEL}-db"
        - name: DB_PORT
          value: "3306"
        - name: DB_CONNECTION
          value: "mysql"
        - name: DB_DATABASE
          value: "${FIREFLY3_DB_DATABASE}"
        - name: DB_USERNAME
          value: "${FIREFLY3_DB_USERNAME}"
        - name: DB_PASSWORD
          value: "${FIREFLY3_DB_PASSWORD}"
        - name: TRUSTED_PROXIES
          value: "**"
        - name: MAIL_MAILER
          value: "${FIREFLY3_MAILER}"
        - name: MAIL_FROM
          value: "${FIREFLY3_MAIL_FROM}"
        - name: MAILGUN_DOMAIN
          value: "${FIREFLY3_MAILGUN_DOMAIN}"
        - name: MAILGUN_SECRET
          value: "${FIREFLY3_MAILGUN_SECRET}"
        - name: MAILGUN_ENDPOINT
          value: "${FIREFLY3_MAILGUN_ENDPOINT}"
        - name: AUTHENTICATION_GUARD
          value: "remote_user_guard"
        - name: AUTHENTICATION_GUARD_HEADER
          value: "${FIREFLY3_GUARD_HEADER}"
        - name: AUTHENTICATION_GUARD_EMAIL
          value: "${FIREFLY3_GUARD_EMAIL}"
        - name: CUSTOM_LOGOUT_URL
          value: "${FIREFLY3_LOGOUT_URL}"
        ports:
        - containerPort: 8080
          protocol: TCP
        volumeMounts:
        - name: vol-${FIREFLY3_LABEL}
          mountPath: /var/www/html/storage/upload
      volumes:
      - name: vol-${FIREFLY3_LABEL}
        persistentVolumeClaim:
          claimName: pvc-${FIREFLY3_LABEL}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-${FIREFLY3_LABEL}
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${FIREFLY3_HOSTNAME}
    secretName: "${FIREFLY3_TLS_SECRET}"
  rules:
  - host: ${FIREFLY3_HOSTNAME}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: svc-${FIREFLY3_LABEL}-http
            port:
              number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-${FIREFLY3_LABEL}-oauth2-proxy
  namespace: default
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${FIREFLY3_HOSTNAME}
    secretName: "${FIREFLY3_TLS_SECRET}"
  rules:
  - host: ${FIREFLY3_HOSTNAME}
    http:
      paths:
      - path: /oauth2
        pathType: Prefix
        backend:
          service:
            name: ${FIREFLY3_OAUTH2_PROXY}
            port:
              number: 4180