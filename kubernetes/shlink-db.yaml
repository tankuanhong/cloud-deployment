# https://github.com/bitnami/containers/blob/main/bitnami/mariadb/10.9/debian-11/rootfs/opt/bitnami/scripts/mariadb-env.sh
# https://hub.docker.com/r/bitnami/mariadb

#PVC_START
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-${SHLINK_DB_LABEL}
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: ${SHLINK_DB_PVC_SIZE}
#PVC_END
---
apiVersion: v1
kind: Service
metadata:
  name: svc-${SHLINK_DB_LABEL}-db
spec:
  ports:
  - port: 3306
  selector:
    app: app-${SHLINK_DB_LABEL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-${SHLINK_DB_LABEL}
  labels:
    app: app-${SHLINK_DB_LABEL}
spec:
  selector:
    matchLabels:
      app: app-${SHLINK_DB_LABEL}
  template:
    metadata:
      labels:
        app: app-${SHLINK_DB_LABEL}
    spec:
      restartPolicy: Always
      containers:
      - image: ${SHLINK_DB_IMAGE}
        name: pod-${SHLINK_DB_LABEL}
        env:
        - name: ALLOW_EMPTY_PASSWORD
          value: "no"
        - name: MARIADB_SKIP_TEST_DB
          value: "yes"
        - name: MARIADB_EXTRA_FLAGS
          value: "--max-connect-errors=1000 --max_connections=155"
        - name: MARIADB_CHARACTER_SET
          value: "utf8"
        - name: MARIADB_COLLATE
          value: "utf8_general_ci"
        - name: MARIADB_ROOT_USER
          value: "root"
        - name: MARIADB_ROOT_PASSWORD
          value: "${SHLINK_DB_ROOT_PASSWORD}"
        - name: MARIADB_USER
          value: "${SHLINK_DB_USERNAME}"
        - name: MARIADB_PASSWORD
          value: "${SHLINK_DB_PASSWORD}"
        - name: MARIADB_DATABASE
          value: "${SHLINK_DB_DATABASE}"
        ports:
        - containerPort: 3306
          protocol: TCP
        volumeMounts:
        - name: vol-${SHLINK_DB_LABEL}
          mountPath: /bitnami/mariadb
      volumes:
      - name: vol-${SHLINK_DB_LABEL}
        persistentVolumeClaim:
          claimName: pvc-${SHLINK_DB_LABEL}
      securityContext:
        fsGroup: 1001
