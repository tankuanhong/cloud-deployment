apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: cloudflare-issuer-${LE_NAME_SUFFIX}
spec:
  acme:
    email: ${LE_EMAIL}
    server: ${LE_ENDPOINT}
    privateKeySecretRef:
      name: cloudflare-issuer-${LE_NAME_SUFFIX}-private-key
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            name: cloudflare-api-token-${CLOUDFLARE_TOKEN_NAME_SUFFIX}
            key: api-token