# https://hub.docker.com/r/bitnami/redis

#PVC_START
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-${OUTLINE_REDIS_LABEL}
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: ${OUTLINE_REDIS_PVC_SIZE}
#PVC_END
---
apiVersion: v1
kind: Service
metadata:
  name: svc-${OUTLINE_REDIS_LABEL}-redis
spec:
  ports:
  - port: 6379
  selector:
    app: app-${OUTLINE_REDIS_LABEL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-${OUTLINE_REDIS_LABEL}
  labels:
    app: app-${OUTLINE_REDIS_LABEL}
spec:
  selector:
    matchLabels:
      app: app-${OUTLINE_REDIS_LABEL}
  template:
    metadata:
      labels:
        app: app-${OUTLINE_REDIS_LABEL}
    spec:
      restartPolicy: Always
      containers:
      - image: ${OUTLINE_REDIS_IMAGE}
        imagePullPolicy: Always
        name: pod-${OUTLINE_REDIS_LABEL}
        env:
        - name: ALLOW_EMPTY_PASSWORD
          value: "yes"
        - name: REDIS_PASSWORD
          value: ""
        ports:
        - containerPort: 6379
          protocol: TCP
        volumeMounts:
        - name: vol-${OUTLINE_REDIS_LABEL}
          mountPath: /bitnami/redis/data
      volumes:
      - name: vol-${OUTLINE_REDIS_LABEL}
        persistentVolumeClaim:
          claimName: pvc-${OUTLINE_REDIS_LABEL}
      securityContext:
        fsGroup: 1001
