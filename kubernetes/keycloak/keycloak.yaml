# https://github.com/bitnami/containers/blob/main/bitnami/keycloak/19/debian-11/rootfs/opt/bitnami/scripts/keycloak-env.sh
# https://hub.docker.com/r/bitnami/keycloak

apiVersion: v1
kind: ConfigMap
metadata:
  name: cfg-${KEYCLOAK_LABEL}-quarkus
data:
  quarkus.properties: |
    quarkus.log.file.rotation.max-file-size=100M
    quarkus.log.file.rotation.max-backup-index=10
---
apiVersion: v1
kind: Service
metadata:
  name: svc-${KEYCLOAK_LABEL}-http
spec:
  ports:
  - port: 8080
  selector:
    app: app-${KEYCLOAK_LABEL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-${KEYCLOAK_LABEL}
  labels:
    app: app-${KEYCLOAK_LABEL}
spec:
  selector:
    matchLabels:
      app: app-${KEYCLOAK_LABEL}
  template:
    metadata:
      labels:
        app: app-${KEYCLOAK_LABEL}
    spec:
      restartPolicy: Always
      containers:
      - image: ${KEYCLOAK_IMAGE}
        imagePullPolicy: Always
        name: con-${KEYCLOAK_LABEL}
        env:
        - name: KEYCLOAK_HOSTNAME
          value: "${KEYCLOAK_HOSTNAME}"
        - name: KEYCLOAK_ADMIN_USER
          value: "${KEYCLOAK_ADMIN_USER}"
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: "${KEYCLOAK_ADMIN_PASSWORD}"
        - name: KEYCLOAK_DATABASE_HOST
          value: "svc-${KEYCLOAK_DB_LABEL}-db"
        - name: KEYCLOAK_DATABASE_PORT
          value: "5432"
        - name: KEYCLOAK_DATABASE_NAME
          value: "${KEYCLOAK_DB_DATABASE}"
        - name: KEYCLOAK_DATABASE_USER
          value: "${KEYCLOAK_DB_USERNAME}"
        - name: KEYCLOAK_DATABASE_PASSWORD
          value: "${KEYCLOAK_DB_PASSWORD}"
        - name: KEYCLOAK_DATABASE_SCHEMA
          value: "public"
        - name: KEYCLOAK_JDBC_PARAMS
          value: ""
        - name: KEYCLOAK_HTTP_PORT
          value: "8080"
        - name: KEYCLOAK_HTTPS_PORT
          value: "8443"
        - name: KEYCLOAK_BIND_ADDRESS
          value: "0.0.0.0"
        - name: KEYCLOAK_ENABLE_TLS
          value: "false"
        - name: KEYCLOAK_TLS_KEYSTORE_FILE
          value: "/opt/bitnami/keycloak/certs/keystore.jks"
        - name: KEYCLOAK_TLS_TRUSTSTORE_FILE
          value: "/opt/bitnami/keycloak/certs/truststore.jks"
        - name: KEYCLOAK_TLS_KEYSTORE_PASSWORD
          value: ""
        - name: KEYCLOAK_TLS_TRUSTSTORE_PASSWORD
          value: ""
        - name: KEYCLOAK_ENABLE_STATISTICS
          value: "true"
        - name: KEYCLOAK_MOUNTED_CONF_DIR
          value: "/bitnami/keycloak/configuration/"
        - name: KEYCLOAK_PRODUCTION
          value: "true"
        - name: KEYCLOAK_PROXY
          value: "edge"
        - name: KEYCLOAK_LOG_LEVEL
          value: "INFO,org.keycloak.events:debug"
        - name: KEYCLOAK_EXTRA_ARGS
          value: "--log=console,file"
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8443
          protocol: TCP
        volumeMounts:
        - name: vol-${KEYCLOAK_LABEL}
          mountPath: /bitnami
        - name: vol-${KEYCLOAK_LABEL}-quarkus
          mountPath: /opt/bitnami/keycloak/conf/quarkus.properties
          subPath: quarkus.properties
        - name: vol-${KEYCLOAK_LOG_LABEL}-log
          mountPath: /opt/bitnami/keycloak/data/log
      - image: ${KEYCLOAK_LOG_IMAGE}
        imagePullPolicy: Always
        name: con-${KEYCLOAK_LOG_LABEL}
        env:
        - name: INGESTION_KEY
          value: "${KEYCLOAK_LOG_INGESTION_KEY}"
        volumeMounts:
        - name: vol-${KEYCLOAK_LOG_LABEL}-log
          mountPath: /logs
        - name: vol-${KEYCLOAK_LOG_LABEL}-work
          mountPath: /work
        - name: vol-${KEYCLOAK_LOG_LABEL}-config
          mountPath: /config
      volumes:
      - name: vol-${KEYCLOAK_LABEL}
        persistentVolumeClaim:
          claimName: pvc-${KEYCLOAK_LABEL}
      - name: vol-${KEYCLOAK_LOG_LABEL}-log
        persistentVolumeClaim:
          claimName: pvc-${KEYCLOAK_LOG_LABEL}-log
      - name: vol-${KEYCLOAK_LOG_LABEL}-work
        persistentVolumeClaim:
          claimName: pvc-${KEYCLOAK_LOG_LABEL}-work
      - name: vol-${KEYCLOAK_LOG_LABEL}-config
        persistentVolumeClaim:
          claimName: pvc-${KEYCLOAK_LOG_LABEL}-config
      - name: vol-${KEYCLOAK_LABEL}-quarkus
        configMap:
          name: cfg-${KEYCLOAK_LABEL}-quarkus
      securityContext:
        fsGroup: 1001
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-${KEYCLOAK_LABEL}
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${KEYCLOAK_HOSTNAME}
    secretName: "${KEYCLOAK_TLS_SECRET}"
  rules:
  - host: ${KEYCLOAK_HOSTNAME}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: svc-${KEYCLOAK_LABEL}-http
            port:
              number: 8080