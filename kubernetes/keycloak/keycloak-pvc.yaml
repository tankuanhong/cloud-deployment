apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-${KEYCLOAK_LABEL}
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: ${KEYCLOAK_PVC_SIZE}
---
