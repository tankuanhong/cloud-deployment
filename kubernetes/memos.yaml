# https://github.com/usememos/memos
# https://hub.docker.com/r/neosmemo/memos

#PVC_START
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-${MEMOS_LABEL}
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: ${MEMOS_PVC_SIZE}
#PVC_END
---
apiVersion: v1
kind: Service
metadata:
  name: svc-${MEMOS_LABEL}-http
spec:
  ports:
  - port: 5230
  selector:
    app: app-${MEMOS_LABEL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-${MEMOS_LABEL}
  labels:
    app: app-${MEMOS_LABEL}
spec:
  selector:
    matchLabels:
      app: app-${MEMOS_LABEL}
  template:
    metadata:
      labels:
        app: app-${MEMOS_LABEL}
    spec:
      restartPolicy: Always
      containers:
      - image: ${MEMOS_IMAGE}
        name: pod-${MEMOS_LABEL}
        ports:
        - containerPort: 5230
          protocol: TCP
        volumeMounts:
        - name: vol-${MEMOS_LABEL}
          mountPath: /.memos
      volumes:
      - name: vol-${MEMOS_LABEL}
        persistentVolumeClaim:
          claimName: pvc-${MEMOS_LABEL}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-${MEMOS_LABEL}
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${MEMOS_HOSTNAME}
    secretName: "${MEMOS_TLS_SECRET}"
  rules:
  - host: ${MEMOS_HOSTNAME}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: svc-${MEMOS_LABEL}-http
            port:
              number: 5230