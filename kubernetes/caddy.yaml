# https://hub.docker.com/_/caddy

#PVC_START
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-${CADDY_LABEL}
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: ${CADDY_PVC_SIZE}
#PVC_END
---
apiVersion: v1
kind: Service
metadata:
  name: svc-${CADDY_LABEL}-http
spec:
  ports:
  - port: 80
  selector:
    app: app-${CADDY_LABEL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-${CADDY_LABEL}
  labels:
    app: app-${CADDY_LABEL}
spec:
  selector:
    matchLabels:
      app: app-${CADDY_LABEL}
  template:
    metadata:
      labels:
        app: app-${CADDY_LABEL}
    spec:
      restartPolicy: Always
      containers:
      - image: ${CADDY_IMAGE}
        name: con-${CADDY_LABEL}
        ports:
        - containerPort: 80
          protocol: TCP
        volumeMounts:
        - name: vol-${CADDY_LABEL}-data
          mountPath: /data
        - name: vol-${CADDY_LABEL}-config
          mountPath: /etc/caddy/Caddyfile
          subPath: Caddyfile
      volumes:
      - name: vol-${CADDY_LABEL}-data
        persistentVolumeClaim:
          claimName: pvc-${CADDY_LABEL}
      - name: vol-${CADDY_LABEL}-config
        configMap:
          name: cfg-${CADDY_LABEL}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-${CADDY_LABEL}
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${CADDY_HOSTNAME}
    secretName: "${CADDY_TLS_SECRET}"
  rules:
  - host: ${CADDY_HOSTNAME}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: svc-${CADDY_LABEL}-http
            port:
              number: 80