# pass custom list of headers to the upstream server
# https://kubernetes.github.io/ingress-nginx/examples/customization/custom-headers/

apiVersion: v1
data:
  X-SSL-Cert: $ssl_client_escaped_cert
  X-Client-Port: $remote_port
  X-Custom-Headers-Serial: "2022-10-19-1011"
kind: ConfigMap
metadata:
  name: custom-headers
  namespace: ingress-nginx