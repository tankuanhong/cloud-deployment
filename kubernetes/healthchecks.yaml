# https://hub.docker.com/r/healthchecks/healthchecks

apiVersion: v1
kind: Service
metadata:
  name: svc-${HEALTHCHECKS_LABEL}-http
spec:
  ports:
  - port: 8000
  selector:
    app: app-${HEALTHCHECKS_LABEL}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dep-${HEALTHCHECKS_LABEL}
  labels:
    app: app-${HEALTHCHECKS_LABEL}
spec:
  selector:
    matchLabels:
      app: app-${HEALTHCHECKS_LABEL}
  template:
    metadata:
      labels:
        app: app-${HEALTHCHECKS_LABEL}
    spec:
      restartPolicy: Always
      containers:
      - image: ${HEALTHCHECKS_IMAGE}
        name: pod-${HEALTHCHECKS_LABEL}
        env:
        - name: ADMINS
          value: "${HEALTHCHECKS_ADMINS}"
        - name: ALLOWED_HOSTS
          value: "${HEALTHCHECKS_ALLOWED_HOSTS}"
        - name: DB
          value: "mysql"
        - name: DB_HOST
          value: "svc-${HEALTHCHECKS_DB_LABEL}-db"
        - name: DB_NAME
          value: "${HEALTHCHECKS_DB_DATABASE}"
        - name: DB_PASSWORD
          value: "${HEALTHCHECKS_DB_PASSWORD}"
        - name: DB_PORT
          value: "3306"
        - name: DB_USER
          value: "${HEALTHCHECKS_DB_USERNAME}"
        - name: DEBUG
          value: "False"
        - name: DEFAULT_FROM_EMAIL
          value: "${HEALTHCHECKS_EMAIL_FROM}"
        - name: EMAIL_HOST
          value: "${HEALTHCHECKS_EMAIL_HOST}"
        - name: EMAIL_HOST_PASSWORD
          value: "${HEALTHCHECKS_EMAIL_PASSWORD}"
        - name: EMAIL_HOST_USER
          value: "${HEALTHCHECKS_EMAIL_USER}"
        - name: EMAIL_PORT
          value: "${HEALTHCHECKS_EMAIL_PORT}"
        - name: EMAIL_USE_TLS
          value: "${HEALTHCHECKS_EMAIL_USE_TLS}"
        - name: EMAIL_USE_SSL
          value: "${HEALTHCHECKS_EMAIL_USE_SSL}"
        - name: EMAIL_USE_VERIFICATION
          value: "${HEALTHCHECKS_EMAIL_USE_VERIFICATION}"
        - name: MASTER_BADGE_LABEL
          value: "${HEALTHCHECKS_BADGE_LABEL}"
        - name: PING_BODY_LIMIT
          value: "${HEALTHCHECKS_PING_BODY_LIMIT}"
        - name: PING_ENDPOINT
          value: "${HEALTHCHECKS_PING_ENDPOINT}"
        - name: PROMETHEUS_ENABLED
          value: "${HEALTHCHECKS_PROMETHEUS_ENABLED}"
        - name: REGISTRATION_OPEN
          value: "${HEALTHCHECKS_REGISTRATION_OPEN}"
        - name: REMOTE_USER_HEADER
          value: "${HEALTHCHECKS_USER_HEADER}"
        - name: SECRET_KEY
          value: '${HEALTHCHECKS_SECRET_KEY}'
        - name: SHELL_ENABLED
          value: "${HEALTHCHECKS_SHELL_ENABLED}"
        - name: SITE_LOGO_URL
          value: "${HEALTHCHECKS_LOGO_URL}"
        - name: SITE_NAME
          value: "${HEALTHCHECKS_SITE_NAME}"
        - name: SITE_ROOT
          value: "${HEALTHCHECKS_SITE_ROOT}"
        - name: TELEGRAM_BOT_NAME
          value: "${HEALTHCHECKS_TELEGRAM_BOT}"
        - name: TELEGRAM_TOKEN
          value: "${HEALTHCHECKS_TELEGRAM_TOKEN}"
        - name: WEBHOOKS_ENABLED
          value: "${HEALTHCHECKS_WEBHOOKS_ENABLED}"
        ports:
        - containerPort: 8000
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-${HEALTHCHECKS_LABEL}
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${HEALTHCHECKS_HOSTNAME}
    secretName: "${HEALTHCHECKS_TLS_SECRET}"
  rules:
  - host: ${HEALTHCHECKS_HOSTNAME}
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: svc-${HEALTHCHECKS_LABEL}-http
            port:
              number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-${HEALTHCHECKS_LABEL}-ping
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${HEALTHCHECKS_HOSTNAME}
    secretName: "${HEALTHCHECKS_TLS_SECRET}"
  rules:
  - host: ${HEALTHCHECKS_HOSTNAME}
    http:
      paths:
      - pathType: Prefix
        path: /ping
        backend:
          service:
            name: svc-${HEALTHCHECKS_LABEL}-http
            port:
              number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-${HEALTHCHECKS_LABEL}-telegram-bot
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${HEALTHCHECKS_HOSTNAME}
    secretName: "${HEALTHCHECKS_TLS_SECRET}"
  rules:
  - host: ${HEALTHCHECKS_HOSTNAME}
    http:
      paths:
      - pathType: Prefix
        path: /integrations/telegram/bot
        backend:
          service:
            name: svc-${HEALTHCHECKS_LABEL}-http
            port:
              number: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ing-${HEALTHCHECKS_LABEL}-oauth2-proxy
  namespace: default
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - ${HEALTHCHECKS_HOSTNAME}
    secretName: "${HEALTHCHECKS_TLS_SECRET}"
  rules:
  - host: ${HEALTHCHECKS_HOSTNAME}
    http:
      paths:
      - path: /oauth2
        pathType: Prefix
        backend:
          service:
            name: ${HEALTHCHECKS_OAUTH2_PROXY}
            port:
              number: 4180